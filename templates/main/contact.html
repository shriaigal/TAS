{% extends "base.html" %}
{% block title %}Contact — {{ APP_NAME }}{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto px-4 py-12">
  <h1 class="text-4xl font-extrabold">Get in touch</h1>
  <p class="mt-2 text-slate-600 dark:text-slate-300">Have a question, feedback, report, or partnership idea? We'd love to hear from you.</p>
  <div class="card mt-6">
    <form method="post" class="space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
      <div><label class="text-sm font-medium" for="name">Name</label><input id="name" name="name" required class="input mt-1"/></div>
      <div><label class="text-sm font-medium" for="email">Email</label><input id="email" name="email" type="email" required class="input mt-1"/></div>
      <div><label class="text-sm font-medium" for="message">Message</label><textarea id="message" name="message" rows="5" required class="textarea mt-1" maxlength="2000"></textarea></div>
      <button class="btn btn-primary">Send message</button>
    </form>
  </div>
</div>
{% endblock %}
