{% extends "base.html" %}
{% block title %}Forgot password — {{ APP_NAME }}{% endblock %}
{% block content %}
<div class="max-w-md mx-auto px-4 py-12">
  <div class="card animate-fade-up">
    <h1 class="text-2xl font-bold">Forgot password?</h1>
    <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">We'll email you a one-time code.</p>
    <form method="post" class="mt-6 space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
      <input name="email" type="email" required class="input" placeholder="you@example.com"/>
      <button class="btn btn-primary w-full">Send reset code</button>
    </form>
  </div>
</div>
{% endblock %}
