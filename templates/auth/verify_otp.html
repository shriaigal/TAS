{% extends "base.html" %}
{% block title %}Verify OTP — {{ APP_NAME }}{% endblock %}
{% block content %}
<div class="max-w-md mx-auto px-4 py-12">
  <div class="card animate-fade-up text-center">
    <div class="text-4xl">🔐</div>
    <h1 class="text-2xl font-bold mt-2">Verify your code</h1>
    <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">We sent a 6-digit code to <b>{{ email }}</b>.</p>
    <form method="post" class="mt-6 space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
      <input name="otp" required maxlength="6" pattern="\d{6}" class="input text-center text-2xl tracking-[0.6em] font-bold" placeholder="••••••"/>
      <button class="btn btn-primary w-full" type="submit">Verify</button>
    </form>
    <p class="text-xs text-slate-500 mt-4">Code expires in 5 minutes.</p>
  </div>
</div>
{% endblock %}
