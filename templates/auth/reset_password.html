{% extends "base.html" %}
{% block title %}Reset password — {{ APP_NAME }}{% endblock %}
{% block content %}
<div class="max-w-md mx-auto px-4 py-12">
  <div class="card animate-fade-up">
    <h1 class="text-2xl font-bold">Set a new password</h1>
    <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">{{ rules }}</p>
    <form method="post" class="mt-6 space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
      <input name="new_password" type="password" required class="input" placeholder="New password"/>
      <input name="confirm_password" type="password" required class="input" placeholder="Confirm password"/>
      <button class="btn btn-primary w-full">Update password</button>
    </form>
  </div>
</div>
{% endblock %}
