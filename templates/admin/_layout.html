{% extends "base.html" %}
{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 py-6 grid lg:grid-cols-12 gap-6">
  <aside class="lg:col-span-3">
    <div class="card sticky top-20">
      <div class="text-xs uppercase tracking-wider text-slate-500 mb-3">Admin</div>
      <nav class="flex flex-col gap-1 text-sm">
        <a href="{{ url_for('admin.dashboard') }}" class="nav-link">📊 Dashboard</a>
        <a href="{{ url_for('admin.users') }}" class="nav-link">👥 Users</a>
        <a href="{{ url_for('admin.feedback') }}" class="nav-link">💬 Feedback</a>
        <a href="{{ url_for('admin.reports') }}" class="nav-link">🚩 Reports</a>
        <a href="{{ url_for('admin.logs') }}" class="nav-link">📜 Activity logs</a>
        <a href="{{ url_for('admin.export_users') }}" class="nav-link">⬇️ Export users</a>
      </nav>
    </div>
  </aside>
  <section class="lg:col-span-9 space-y-6">
    {% block admin_content %}{% endblock %}
  </section>
</div>
{% endblock %}
