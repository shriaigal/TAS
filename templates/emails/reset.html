<div style="font-family:Inter,Arial,sans-serif;max-width:600px;margin:0 auto;padding:24px;background:#f8fafc;">
  <div style="background:linear-gradient(135deg,#ef4444,#7c3aed);padding:28px;border-radius:14px 14px 0 0;text-align:center;color:#fff;">
    <h1 style="margin:0;">Password reset</h1>
  </div>
  <div style="background:#fff;padding:28px;border-radius:0 0 14px 14px;">
    <h2 style="color:#0f172a;">Hi {{ name }},</h2>
    <p style="color:#475569;">Use the code below to reset your {{ app_name }} password:</p>
    <div style="text-align:center;margin:22px 0;padding:18px;border:2px dashed #ef4444;border-radius:12px;">
      <span style="font-size:34px;font-weight:800;letter-spacing:10px;color:#ef4444;">{{ otp }}</span>
    </div>
    <p style="color:#64748b;font-size:13px;">If you didn't request this, you can safely ignore the email.</p>
  </div>
</div>
